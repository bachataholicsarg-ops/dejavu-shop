<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DÉJÀ VU · Vendedores</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#fbf6ee;color:#14363b}
.wrap{max-width:1100px;margin:auto;padding:28px}
h1{font-family:Georgia,serif}
.card{background:white;border:1px solid #e7dfd3;border-radius:18px;padding:20px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:#fff;border:1px solid #e7dfd3;border-radius:16px;padding:18px}
.kpi b{display:block;font-size:26px;margin-top:6px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}
.badge{display:inline-block;padding:6px 10px;background:#eef7f3;border-radius:999px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>DÉJÀ VU · Panel de vendedores</h1>
<div class="grid">
<div class="kpi">Ventas atribuidas<b>$ 0</b></div>
<div class="kpi">Comisión generada<b>$ 0</b></div>
<div class="kpi">Comisión pagada<b>$ 0</b></div>
<div class="kpi">Comisión pendiente<b>$ 0</b></div>
</div>
<div class="card">
<h2>Vendedores</h2>
<table>
<thead><tr><th>Vendedor</th><th>Código</th><th>%</th><th>Ventas</th><th>Comisión</th><th>Estado</th></tr></thead>
<tbody>
<tr><td>Ejemplo Laura</td><td>laura</td><td>10%</td><td>$ 0</td><td>$ 0</td><td><span class="badge">Activo</span></td></tr>
</tbody>
</table>
</div>
</div>
</body>
</html>
