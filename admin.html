<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DÉJÀ VU Admin</title><style>
:root{--bg:#fbf6ee;--ink:#14363b;--teal:#1f6a6a;--line:#e8e1d7}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:24px}.brand{font-family:Georgia,serif;font-size:30px;font-weight:700}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.kpi b{display:block;font-size:24px;margin-top:6px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--teal);color:white}.secondary{background:white;border:1px solid var(--line)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.hidden{display:none}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form input,.form select{padding:11px;border:1px solid var(--line);border-radius:9px}.full{grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.card{overflow:auto}}</style></head><body><div class="wrap">
<div class="brand">♛ DÉJÀ VU Admin</div>
<div id="login" class="card"><h2>Ingresar</h2><p>Ingresá con tu email y contraseña de administrador.</p><input id="email" value="dejavu.shop.ar@gmail.com" type="email" placeholder="Email" style="padding:12px;width:min(360px,100%);border:1px solid var(--line);border-radius:10px;margin-bottom:10px"><br><input id="password" type="password" placeholder="Contraseña" style="padding:12px;width:min(360px,100%);border:1px solid var(--line);border-radius:10px;margin-bottom:10px"><br><button class="btn primary" onclick="loginPassword()">Ingresar</button> <button class="btn secondary" onclick="recoverPassword()">Recuperar contraseña</button><div id="loginMsg" style="margin-top:10px"></div></div>
<div id="app" class="hidden">
<div class="tabs"><button class="btn secondary" onclick="show('resumen')">Resumen</button><button class="btn secondary" onclick="show('productos')">Productos</button><button class="btn secondary" onclick="show('pedidos')">Pedidos</button><button class="btn secondary" onclick="show('vendedores')">Vendedores</button><button class="btn secondary" onclick="show('envios')">Envíos</button><button class="btn secondary" onclick="logout()">Salir</button></div>
<section id="resumen" class="section"><div class="grid" id="kpis"></div></section>
<section id="productos" class="section hidden"><div class="card"><h2>Nuevo producto</h2><form id="productForm" class="form"><input name="nombre" required placeholder="Nombre"><input name="slug" required placeholder="slug-producto"><input name="categoria" required placeholder="Categoría"><input name="costo" type="number" step="0.01" placeholder="Costo"><input name="stock" type="number" value="0" min="0" placeholder="Stock"><input name="proveedor_url" placeholder="Link proveedor"><button class="btn primary full" type="submit">Guardar producto</button></form></div><div class="card"><table><thead><tr><th>Producto</th><th>Costo</th><th>Venta</th><th>Stock</th><th>Activo</th></tr></thead><tbody id="productsBody"></tbody></table></div></section>
<section id="pedidos" class="section hidden"><div class="card"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Zona</th><th>Entrega</th><th>Pago</th><th>Vendedor</th><th>Comisión</th><th>Estado</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section>
<section id="vendedores" class="section hidden"><div class="card"><h2>Nuevo vendedor</h2><form id="sellerForm" class="form"><input name="nombre" required placeholder="Nombre"><input name="codigo" required placeholder="Código (ej: laura)"><input name="email" placeholder="Email"><input name="telefono" placeholder="Teléfono"><input name="porcentaje_comision" type="number" step="0.01" value="10" placeholder="% comisión"><button class="btn primary full" type="submit">Guardar vendedor</button></form></div><div class="card"><table><thead><tr><th>Nombre</th><th>Código</th><th>%</th><th>Ventas</th><th>Comisión</th></tr></thead><tbody id="sellersBody"></tbody></table></div></section>
<section id="envios" class="section hidden"><div class="card"><table><thead><tr><th>Zona</th><th>Envío gratis desde</th></tr></thead><tbody id="shippingBody"></tbody></table></div></section>
</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U="https://mzcmkcernmklmaerxqxu.supabase.co",K="sb_publishable_FuJzy7ynwi1vHBkwQpQ1vA_Bk6gVZOf",sb=supabase.createClient(U,K),money=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(Number(n||0));
async function loginPassword(){const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});loginMsg.textContent=error?"Email o contraseña incorrectos.":"";if(!error)boot()} async function recoverPassword(){const mail=email.value.trim();if(!mail){loginMsg.textContent="Ingresá tu email.";return}loginMsg.textContent="Enviando enlace de recuperación...";const {error}=await sb.auth.resetPasswordForEmail(mail,{redirectTo:"https://dejavu-shop.vercel.app/reset-password.html"});loginMsg.textContent=error?error.message:"Te enviamos un enlace para crear una nueva contraseña."}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return;login.classList.add("hidden");app.classList.remove("hidden");await loadAll()}
async function logout(){await sb.auth.signOut();location.reload()}
function show(id){document.querySelectorAll(".section").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
async function loadAll(){const [{data:p},{data:o},{data:v},{data:s}]=await Promise.all([
 sb.from("productos").select("*").order("nombre"),
 sb.from("pedidos").select("*,vendedores(nombre)").order("creado_en",{ascending:false}),
 sb.from("vendedores").select("*").order("nombre"),
 sb.from("configuracion_envios").select("*").order("zona")
]);productsBody.innerHTML=(p||[]).map(x=>"<tr><td>"+x.nombre+"</td><td>"+money(x.costo)+"</td><td>"+money(x.precio)+"</td><td>"+x.stock+"</td><td>"+x.activo+"</td></tr>").join("");
ordersBody.innerHTML=(o||[]).map(x=>"<tr><td>"+x.numero+"</td><td><b>"+x.cliente_nombre+"</b><br><small>"+x.cliente_whatsapp+"</small></td><td>"+money(x.total)+"</td><td>"+x.zona_envio+"</td><td>"+(x.fecha_entrega_preferida||"A coordinar")+"<br><small>"+(x.franja_horaria||"Sin horario")+"</small></td><td>"+(x.metodo_pago||"coordinar")+"<br><small>"+(x.contacto_preferido||"WhatsApp")+"</small></td><td>"+(x.vendedores?.nombre||"-")+"</td><td>"+money(x.comision_total)+"</td><td>"+x.estado+"</td></tr>").join("");
const agg={};(o||[]).forEach(x=>{if(x.vendedor_id){agg[x.vendedor_id]??={ventas:0,comision:0};agg[x.vendedor_id].ventas+=Number(x.subtotal);agg[x.vendedor_id].comision+=Number(x.comision_total)}});
sellersBody.innerHTML=(v||[]).map(x=>"<tr><td>"+x.nombre+"</td><td>"+x.codigo+"</td><td>"+x.porcentaje_comision+"%</td><td>"+money(agg[x.id]?.ventas||0)+"</td><td>"+money(agg[x.id]?.comision||0)+"</td></tr>").join("");
shippingBody.innerHTML=(s||[]).map(x=>"<tr><td>"+x.zona+"</td><td>"+(x.minimo_envio_gratis?money(x.minimo_envio_gratis):"A coordinar")+"</td></tr>").join("");
kpis.innerHTML="<div class='kpi'>Pedidos<b>"+(o||[]).length+"</b></div><div class='kpi'>Ventas<b>"+money((o||[]).reduce((a,x)=>a+Number(x.total),0))+"</b></div><div class='kpi'>Comisiones<b>"+money((o||[]).reduce((a,x)=>a+Number(x.comision_total),0))+"</b></div><div class='kpi'>Productos<b>"+(p||[]).length+"</b></div>"}
productForm.addEventListener("submit",async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(productForm));f.costo=f.costo?Number(f.costo):null;f.precio=f.costo?Number(f.costo)*2:null;f.stock=Number(f.stock||0);const {error}=await sb.from("productos").insert(f);if(error)return alert(error.message);productForm.reset();await loadAll()});
sellerForm.addEventListener("submit",async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(sellerForm));f.codigo=String(f.codigo).toLowerCase().trim();f.porcentaje_comision=Number(f.porcentaje_comision||10);const {error}=await sb.from("vendedores").insert(f);if(error)return alert(error.message);sellerForm.reset();await loadAll()});
sb.auth.onAuthStateChange(()=>boot());boot();
</script></body></html>
