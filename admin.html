<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DÉJÀ VU Admin</title><style>
:root{--bg:#fbf6ee;--ink:#14363b;--teal:#1f6a6a;--line:#e8e1d7}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:24px}.brand{font-family:Georgia,serif;font-size:30px;font-weight:700}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.kpi b{display:block;font-size:24px;margin-top:6px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--teal);color:white}.secondary{background:white;border:1px solid var(--line)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.hidden{display:none}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form input,.form select{padding:11px;border:1px solid var(--line);border-radius:9px}.full{grid-column:1/-1}.thumb{width:58px;height:58px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#f5f5f5}.actions{display:flex;gap:6px;flex-wrap:wrap}.danger{background:#9f2d20;color:#fff}.warn{background:#e9a23b;color:#222}.form small{color:#687779}.preview{width:110px;height:110px;object-fit:cover;border:1px solid var(--line);border-radius:14px;display:none}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.card{overflow:auto}}</style></head><body><div class="wrap">
<div class="brand">♛ DÉJÀ VU Admin</div>
<div id="login" class="card"><h2>Ingresar</h2><p>Ingresá con tu email y contraseña de administrador.</p><input id="email" value="dejavu.shop.ar@gmail.com" type="email" placeholder="Email" style="padding:12px;width:min(360px,100%);border:1px solid var(--line);border-radius:10px;margin-bottom:10px"><br><input id="password" type="password" placeholder="Contraseña" style="padding:12px;width:min(360px,100%);border:1px solid var(--line);border-radius:10px;margin-bottom:10px"><br><button class="btn primary" onclick="loginPassword()">Ingresar</button> <button class="btn secondary" onclick="recoverPassword()">Recuperar contraseña</button><div id="loginMsg" style="margin-top:10px"></div></div>
<div id="app" class="hidden">
<div class="tabs"><button class="btn secondary" onclick="show('resumen')">Resumen</button><button class="btn secondary" onclick="show('productos')">Productos</button><button class="btn secondary" onclick="show('pedidos')">Pedidos</button><button class="btn secondary" onclick="show('vendedores')">Vendedores</button><button class="btn secondary" onclick="show('envios')">Envíos</button><button class="btn secondary" onclick="logout()">Salir</button></div>
<section id="resumen" class="section"><div class="grid" id="kpis"></div></section>
<section id="productos" class="section hidden">
<div class="card">
<h2 id="productTitle">Nuevo producto</h2>
<form id="productForm" class="form">
<input name="nombre" required placeholder="Nombre">
<input name="slug" placeholder="Código/slug (si lo dejás vacío se genera solo)">
<input name="categoria" required placeholder="Categoría">
<input name="costo" id="productCost" type="number" step="0.01" placeholder="Costo">
<input name="precio" id="productPrice" type="number" step="0.01" placeholder="Precio de venta">
<input name="stock" type="number" value="0" min="0" placeholder="Stock">
<input name="proveedor_url" class="full" placeholder="Link proveedor (opcional)">
<div><label><b>Foto del producto</b></label><br><input name="foto" id="productPhoto" type="file" accept="image/jpeg,image/png,image/webp"></div>
<div><img id="productPreview" class="preview" alt="Vista previa"></div>
<div class="full actions"><button class="btn primary" id="productSaveBtn" type="submit">Guardar producto</button><button class="btn secondary hidden" id="productCancelBtn" type="button" onclick="cancelProductEdit()">Cancelar edición</button></div>
</form>
</div>
<div class="card"><table><thead><tr><th>Foto</th><th>Producto</th><th>Costo</th><th>Venta</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="productsBody"></tbody></table></div>
</section>
<section id="pedidos" class="section hidden"><div class="card"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Zona</th><th>Entrega</th><th>Pago</th><th>Vendedor</th><th>Comisión</th><th>Estado</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section>
<section id="vendedores" class="section hidden"><div class="card"><h2>Nuevo vendedor</h2><form id="sellerForm" class="form"><input name="nombre" required placeholder="Nombre"><input name="codigo" required placeholder="Código (ej: laura)"><input name="email" placeholder="Email"><input name="telefono" placeholder="Teléfono"><input name="porcentaje_comision" type="number" step="0.01" value="10" placeholder="% comisión"><button class="btn primary full" type="submit">Guardar vendedor</button></form></div><div class="card"><table><thead><tr><th>Nombre</th><th>Código</th><th>%</th><th>Ventas</th><th>Comisión</th><th>Panel</th></tr></thead><tbody id="sellersBody"></tbody></table></div></section>
<section id="envios" class="section hidden"><div class="card"><table><thead><tr><th>Zona</th><th>Envío gratis desde</th></tr></thead><tbody id="shippingBody"></tbody></table></div></section>
</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U="https://mzcmkcernmklmaerxqxu.supabase.co",K="sb_publishable_FuJzy7ynwi1vHBkwQpQ1vA_Bk6gVZOf",sb=supabase.createClient(U,K),money=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(Number(n||0)); let editingProductId=null,productsCache=[];
async function loginPassword(){const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});loginMsg.textContent=error?"Email o contraseña incorrectos.":"";if(!error)boot()} async function recoverPassword(){const mail=email.value.trim();if(!mail){loginMsg.textContent="Ingresá tu email.";return}loginMsg.textContent="Enviando enlace de recuperación...";const {error}=await sb.auth.resetPasswordForEmail(mail,{redirectTo:"https://dejavu-shop.vercel.app/reset-password.html"});loginMsg.textContent=error?error.message:"Te enviamos un enlace para crear una nueva contraseña."}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return;login.classList.add("hidden");app.classList.remove("hidden");await loadAll()}
async function logout(){await sb.auth.signOut();location.reload()}
function show(id){document.querySelectorAll(".section").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
async function loadAll(){const [{data:p},{data:o},{data:v},{data:s}]=await Promise.all([
 sb.from("productos").select("*").order("nombre"),
 sb.from("pedidos").select("*,vendedores(nombre)").order("creado_en",{ascending:false}),
 sb.from("vendedores").select("*").order("nombre"),
 sb.from("configuracion_envios").select("*").order("zona")
]);productsCache=p||[];productsBody.innerHTML=productsCache.map(x=>"<tr><td>"+(x.imagen_url?"<img class='thumb' src='"+x.imagen_url+"' alt=''>":"—")+"</td><td><b>"+x.nombre+"</b><br><small>"+(x.categoria||"")+"</small></td><td>"+money(x.costo)+"</td><td>"+money(x.precio)+"</td><td>"+x.stock+"</td><td>"+(x.activo?"Activo":"Pausado")+"</td><td><div class='actions'><button class='btn secondary' onclick=\"editProduct('"+x.id+"')\">Editar</button><button class='btn warn' onclick=\"toggleProduct('"+x.id+"',"+x.activo+")\">"+(x.activo?"Pausar":"Activar")+"</button><button class='btn danger' onclick=\"deleteProduct('"+x.id+"')\">Eliminar</button></div></td></tr>").join("");
ordersBody.innerHTML=(o||[]).map(x=>"<tr><td>"+x.numero+"</td><td><b>"+x.cliente_nombre+"</b><br><small>"+x.cliente_whatsapp+"</small></td><td>"+money(x.total)+"</td><td>"+x.zona_envio+"</td><td>"+(x.fecha_entrega_preferida||"A coordinar")+"<br><small>"+(x.franja_horaria||"Sin horario")+"</small></td><td>"+(x.metodo_pago||"coordinar")+"<br><small>"+(x.contacto_preferido||"WhatsApp")+"</small></td><td>"+(x.vendedores?.nombre||"-")+"</td><td>"+money(x.comision_total)+"</td><td>"+x.estado+"</td></tr>").join("");
const agg={};(o||[]).forEach(x=>{if(x.vendedor_id){agg[x.vendedor_id]??={ventas:0,comision:0};agg[x.vendedor_id].ventas+=Number(x.subtotal);agg[x.vendedor_id].comision+=Number(x.comision_total)}});
sellersBody.innerHTML=(v||[]).map(x=>"<tr><td>"+x.nombre+"</td><td>"+x.codigo+"</td><td>"+x.porcentaje_comision+"%</td><td>"+money(agg[x.id]?.ventas||0)+"</td><td>"+money(agg[x.id]?.comision||0)+"</td><td><a href=\"/vendedor.html?token="+x.portal_token+"\" target=\"_blank\">Abrir panel</a></td></tr>").join("");
shippingBody.innerHTML=(s||[]).map(x=>"<tr><td>"+x.zona+"</td><td>"+(x.minimo_envio_gratis?money(x.minimo_envio_gratis):"A coordinar")+"</td></tr>").join("");
kpis.innerHTML="<div class='kpi'>Pedidos<b>"+(o||[]).length+"</b></div><div class='kpi'>Ventas<b>"+money((o||[]).reduce((a,x)=>a+Number(x.total),0))+"</b></div><div class='kpi'>Comisiones<b>"+money((o||[]).reduce((a,x)=>a+Number(x.comision_total),0))+"</b></div><div class='kpi'>Productos<b>"+(p||[]).length+"</b></div>"}
productCost.addEventListener("input",()=>{if(!editingProductId||!productPrice.dataset.manual)productPrice.value=productCost.value?Number(productCost.value)*2:""});
productPrice.addEventListener("input",()=>productPrice.dataset.manual="1");
productPhoto.addEventListener("change",()=>{const f=productPhoto.files?.[0];if(!f)return;productPreview.src=URL.createObjectURL(f);productPreview.style.display="block"});
async function uploadProductPhoto(file,id){if(!file)return null;const ext=(file.name.split(".").pop()||"jpg").toLowerCase();const path=id+"/"+Date.now()+"."+ext;const {error}=await sb.storage.from("productos").upload(path,file,{upsert:true,contentType:file.type});if(error)throw error;return sb.storage.from("productos").getPublicUrl(path).data.publicUrl}
function editProduct(id){const x=productsCache.find(p=>p.id===id);if(!x)return;editingProductId=id;productTitle.textContent="Editar producto";productSaveBtn.textContent="Guardar cambios";productCancelBtn.classList.remove("hidden");for(const k of ["nombre","slug","categoria","costo","precio","stock","proveedor_url"]){if(productForm.elements[k])productForm.elements[k].value=x[k]??""}productPrice.dataset.manual="1";if(x.imagen_url){productPreview.src=x.imagen_url;productPreview.style.display="block"}else productPreview.style.display="none";productForm.scrollIntoView({behavior:"smooth",block:"start"})}
function cancelProductEdit(){editingProductId=null;productForm.reset();productTitle.textContent="Nuevo producto";productSaveBtn.textContent="Guardar producto";productCancelBtn.classList.add("hidden");productPreview.style.display="none";delete productPrice.dataset.manual}
async function toggleProduct(id,activo){const {error}=await sb.from("productos").update({activo:!activo}).eq("id",id);if(error)return alert(error.message);await loadAll()}
async function deleteProduct(id){const x=productsCache.find(p=>p.id===id);if(!confirm("¿Eliminar definitivamente "+(x?.nombre||"este producto")+"?"))return;const {error}=await sb.from("productos").delete().eq("id",id);if(error)return alert(error.message);await loadAll()}
function slugify(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,70)}
productForm.addEventListener("submit",async e=>{e.preventDefault();const fd=new FormData(productForm),photo=fd.get("foto");fd.delete("foto");const f=Object.fromEntries(fd);f.slug=slugify(f.slug||f.nombre);if(!f.slug)f.slug="producto-"+Date.now();f.costo=f.costo!==""?Number(f.costo):null;f.precio=f.precio!==""?Number(f.precio):(f.costo!==null?f.costo*2:null);f.stock=Number(f.stock||0);let id=editingProductId;
if(!id){const {data:existing}=await sb.from("productos").select("id,nombre").eq("slug",f.slug).maybeSingle();if(existing){alert("Ese código/slug ya existe y pertenece a: "+existing.nombre+". Usá otro código o editá ese producto desde la lista.");return}const {data,error}=await sb.from("productos").insert(f).select("id").single();if(error)return alert(error.message);id=data.id}else{const {data:existing}=await sb.from("productos").select("id,nombre").eq("slug",f.slug).neq("id",id).maybeSingle();if(existing){alert("Ese código/slug ya lo usa: "+existing.nombre+". Elegí otro.");return}const {error}=await sb.from("productos").update(f).eq("id",id);if(error)return alert(error.message)}
try{if(photo&&photo.size){const url=await uploadProductPhoto(photo,id);const {error}=await sb.from("productos").update({imagen_url:url}).eq("id",id);if(error)throw error}}catch(err){alert("Producto guardado, pero no se pudo subir la foto: "+err.message);await loadAll();return}alert("Producto guardado correctamente.");cancelProductEdit();await loadAll()});
sellerForm.addEventListener("submit",async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(sellerForm));f.codigo=String(f.codigo).toLowerCase().trim();f.porcentaje_comision=Number(f.porcentaje_comision||10);const {error}=await sb.from("vendedores").insert(f);if(error)return alert(error.message);sellerForm.reset();await loadAll()});
sb.auth.onAuthStateChange(()=>boot());boot();
</script></body></html>
